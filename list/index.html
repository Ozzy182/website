<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Pages</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f5f6f8;
            color: #222;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .description {
            margin: 0 0 30px;
            color: #777;
            font-size: 14px;
        }

        .page-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .page {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 16px 18px;

            background: #fff;
            border: 1px solid #e4e6e8;
            border-radius: 8px;

            color: #222;
            text-decoration: none;

            transition:
                border-color .2s,
                box-shadow .2s,
                transform .2s;
        }

        .page:hover {
            border-color: #aaa;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .06);
            transform: translateY(-1px);
        }

        .page-content {
            min-width: 0;
        }

        .page-title {
            font-size: 16px;
            font-weight: 600;
        }

        .page-url {
            margin-top: 4px;
            color: #777;
            font-size: 13px;
            font-family: monospace;
            word-break: break-all;
        }

        .arrow {
            flex-shrink: 0;
            color: #999;
            font-size: 20px;
        }

        .status {
            padding: 20px;
            background: #fff;
            border: 1px solid #e4e6e8;
            border-radius: 8px;
            color: #777;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Website Pages</h1>

    <p class="description" id="pageCount">
        Loading pages...
    </p>

    <div class="page-list" id="pageList">
        <div class="status">
            Loading...
        </div>
    </div>

</div>


<script>
    const pageList = document.getElementById('pageList');
    const pageCount = document.getElementById('pageCount');

    fetch('./list.json')
        .then(response => {
            if (!response.ok) {
                throw new Error('Could not load list.json');
            }

            return response.json();
        })
        .then(pages => {

            pageList.innerHTML = '';

            pages.forEach(page => {

                const link = document.createElement('a');

                link.className = 'page';
                link.href = page.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';

                link.innerHTML = `
                    <div class="page-content">
                        <div class="page-title">${escapeHtml(page.title)}</div>
                        <div class="page-url">${escapeHtml(page.url)}</div>
                    </div>

                    <div class="arrow">→</div>
                `;

                pageList.appendChild(link);
            });


            pageCount.textContent =
                `${pages.length} ${pages.length === 1 ? 'page' : 'pages'}`;

        })
        .catch(error => {

            console.error(error);

            pageCount.textContent = 'Error';

            pageList.innerHTML = `
                <div class="status">
                    Unable to load list.json
                </div>
            `;

        });


    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }
</script>

</body>
</html>
