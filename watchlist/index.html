<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Watchlist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #253056 0,
                    transparent 35%
                ),
                #0d1117;

            color: #f5f7fa;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .container {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: 70px 0;
        }

        /* Header */

        .header {
            margin-bottom: 40px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .title-area h1 {
            margin: 0;

            font-size: clamp(32px, 5vw, 52px);
            line-height: 1.1;
            letter-spacing: -2px;
        }

        .title-area p {
            margin: 10px 0 0;

            color: #8b949e;
            font-size: 16px;
        }

        .movie-count {
            flex-shrink: 0;

            padding: 9px 14px;

            background: #161b22;

            border: 1px solid #30363d;
            border-radius: 100px;

            color: #c9d1d9;

            font-size: 14px;
        }

        /* Add Movie */

        .add-box {
            display: flex;
            gap: 10px;

            margin-bottom: 40px;
            padding: 12px;

            background: #161b22;

            border: 1px solid #30363d;
            border-radius: 14px;
        }

        .movie-input {
            width: 100%;
            min-width: 0;

            padding: 14px 16px;

            background: transparent;

            border: 0;
            outline: none;

            color: #fff;
            font-size: 16px;
        }

        .movie-input::placeholder {
            color: #6e7681;
        }

        .add-button {
            flex-shrink: 0;

            padding: 13px 22px;

            background: #2f81f7;
            color: #fff;

            border: 0;
            border-radius: 9px;

            cursor: pointer;

            font-weight: 600;

            transition:
                background .2s ease,
                transform .2s ease;
        }

        .add-button:hover {
            background: #388bfd;
            transform: translateY(-1px);
        }

        /* Message */

        .message {
            display: none;

            margin-top: -25px;
            margin-bottom: 25px;

            color: #f85149;
            font-size: 14px;
        }

        /* Movie list */

        .movie-list {
            display: grid;
            gap: 12px;
        }

        .movie {
            display: flex;
            align-items: center;
            gap: 16px;

            min-height: 74px;
            padding: 15px 18px;

            background: #161b22;

            border: 1px solid #30363d;
            border-radius: 12px;

            transition:
                border-color .2s ease,
                transform .2s ease,
                background .2s ease;
        }

        .movie:hover {
            background: #1b2129;
            border-color: #484f58;

            transform: translateY(-1px);
        }

        .movie-number {
            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            width: 38px;
            height: 38px;

            background: #21262d;

            border-radius: 9px;

            color: #8b949e;

            font-size: 13px;
            font-weight: 700;
        }

        .movie-info {
            flex: 1;
            min-width: 0;
        }

        .movie-name {
            margin: 0;

            color: #f0f6fc;

            font-size: 17px;
            font-weight: 600;

            word-break: break-word;
        }

        .movie-date {
            margin-top: 5px;

            color: #6e7681;

            font-size: 12px;
        }

        /* Delete */

        .delete-button {
            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            width: 39px;
            height: 39px;

            background: transparent;
            color: #8b949e;

            border: 1px solid transparent;
            border-radius: 8px;

            cursor: pointer;

            transition:
                background .2s ease,
                color .2s ease,
                border-color .2s ease;
        }

        .delete-button:hover {
            background: rgba(248, 81, 73, .1);
            color: #f85149;
            border-color: rgba(248, 81, 73, .3);
        }

        .delete-button svg {
            width: 18px;
            height: 18px;
        }

        /* Empty state */

        .empty {
            padding: 70px 20px;

            text-align: center;

            background: #161b22;

            border: 1px dashed #30363d;
            border-radius: 14px;
        }

        .empty-icon {
            margin-bottom: 18px;

            font-size: 48px;
        }

        .empty h2 {
            margin: 0 0 7px;

            font-size: 20px;
        }

        .empty p {
            margin: 0;

            color: #8b949e;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .container {
                width: min(100% - 22px, 900px);
                padding: 35px 0;
            }

            .header-top {
                align-items: flex-start;
            }

            .title-area h1 {
                font-size: 34px;
                letter-spacing: -1px;
            }

            .add-box {
                padding: 8px;
            }

            .movie-input {
                padding: 12px;
            }

            .add-button {
                padding: 11px 16px;
            }

            .movie {
                padding: 13px;
            }

            .movie-number {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="header-top">

            <div class="title-area">
                <h1>Movie Watchlist</h1>
                <p>Movies I want to watch.</p>
            </div>

            <div
                class="movie-count"
                id="movieCount"
            >
                0 movies
            </div>

        </div>

    </header>


    <!-- Add Movie -->

    <form
        class="add-box"
        id="addMovieForm"
        autocomplete="off"
    >

        <input
            class="movie-input"
            id="movieInput"
            type="text"
            placeholder="Enter a movie name..."
            maxlength="200"
            required
            autofocus
        >

        <button
            class="add-button"
            type="submit"
        >
            + Add
        </button>

    </form>


    <div
        class="message"
        id="message"
    ></div>


    <!-- Movies -->

    <div id="movieContainer"></div>

</div>


<script>

    const STORAGE_KEY = 'movie_watchlist';

    const form = document.getElementById('addMovieForm');
    const movieInput = document.getElementById('movieInput');
    const movieContainer = document.getElementById('movieContainer');
    const movieCount = document.getElementById('movieCount');
    const message = document.getElementById('message');


    /*
    |--------------------------------------------------------------------------
    | Get Movies
    |--------------------------------------------------------------------------
    */

    function getMovies() {

        try {

            const savedMovies = localStorage.getItem(STORAGE_KEY);

            if (!savedMovies) {
                return [];
            }

            const movies = JSON.parse(savedMovies);

            return Array.isArray(movies) ? movies : [];

        } catch (error) {

            console.error('Could not read movies:', error);

            return [];
        }
    }


    /*
    |--------------------------------------------------------------------------
    | Save Movies
    |--------------------------------------------------------------------------
    */

    function saveMovies(movies) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(movies)
        );
    }


    /*
    |--------------------------------------------------------------------------
    | Escape HTML
    |--------------------------------------------------------------------------
    */

    function escapeHTML(text) {

        const div = document.createElement('div');

        div.textContent = text;

        return div.innerHTML;
    }


    /*
    |--------------------------------------------------------------------------
    | Format Date
    |--------------------------------------------------------------------------
    */

    function formatDate(dateString) {

        const date = new Date(dateString);

        return date.toLocaleDateString(
            'en-US',
            {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            }
        );
    }


    /*
    |--------------------------------------------------------------------------
    | Show Message
    |--------------------------------------------------------------------------
    */

    function showMessage(text) {

        message.textContent = text;
        message.style.display = 'block';

        setTimeout(function () {

            message.style.display = 'none';

        }, 3000);
    }


    /*
    |--------------------------------------------------------------------------
    | Render Movies
    |--------------------------------------------------------------------------
    */

    function renderMovies() {

        const movies = getMovies();

        const count = movies.length;

        movieCount.textContent =
            count + (count === 1 ? ' movie' : ' movies');


        /*
        |--------------------------------------------------------------------------
        | Empty
        |--------------------------------------------------------------------------
        */

        if (count === 0) {

            movieContainer.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        🎬
                    </div>

                    <h2>Your watchlist is empty</h2>

                    <p>
                        Add your first movie above.
                    </p>

                </div>
            `;

            return;
        }


        /*
        |--------------------------------------------------------------------------
        | List
        |--------------------------------------------------------------------------
        */

        let html = '<div class="movie-list">';


        /*
         * Latest added first
         */

        const reversedMovies = [...movies].reverse();


        reversedMovies.forEach(function (movie, index) {

            const number = count - index;

            html += `

                <div class="movie">

                    <div class="movie-number">
                        ${number}
                    </div>

                    <div class="movie-info">

                        <h2 class="movie-name">
                            ${escapeHTML(movie.name)}
                        </h2>

                        <div class="movie-date">
                            Added ${formatDate(movie.createdAt)}
                        </div>

                    </div>


                    <button
                        class="delete-button"
                        type="button"
                        data-id="${movie.id}"
                        title="Remove movie"
                        aria-label="Remove ${escapeHTML(movie.name)}"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path d="M3 6h18"></path>

                            <path d="M8 6V4h8v2"></path>

                            <path d="M19 6l-1 14H6L5 6"></path>

                            <path d="M10 11v5"></path>

                            <path d="M14 11v5"></path>

                        </svg>

                    </button>

                </div>

            `;
        });


        html += '</div>';

        movieContainer.innerHTML = html;
    }


    /*
    |--------------------------------------------------------------------------
    | Add Movie
    |--------------------------------------------------------------------------
    */

    form.addEventListener('submit', function (event) {

        event.preventDefault();

        const movieName = movieInput.value.trim();

        if (!movieName) {
            return;
        }


        const movies = getMovies();


        /*
         * Check duplicate
         */

        const duplicate = movies.some(function (movie) {

            return movie.name
                .trim()
                .toLowerCase() === movieName.toLowerCase();

        });


        if (duplicate) {

            showMessage('That movie is already in your watchlist.');

            movieInput.select();

            return;
        }


        /*
         * Add
         */

        movies.push({

            id:
                Date.now().toString() +
                Math.random().toString(36).substring(2),

            name: movieName,

            createdAt: new Date().toISOString()

        });


        saveMovies(movies);

        movieInput.value = '';

        movieInput.focus();

        renderMovies();
    });


    /*
    |--------------------------------------------------------------------------
    | Delete Movie
    |--------------------------------------------------------------------------
    */

    movieContainer.addEventListener('click', function (event) {

        const deleteButton =
            event.target.closest('.delete-button');


        if (!deleteButton) {
            return;
        }


        const id = deleteButton.dataset.id;

        const movies = getMovies();

        const movie = movies.find(function (movie) {
            return movie.id === id;
        });


        if (!movie) {
            return;
        }


        const confirmed = confirm(
            'Remove "' + movie.name + '" from your watchlist?'
        );


        if (!confirmed) {
            return;
        }


        const updatedMovies = movies.filter(function (movie) {
            return movie.id !== id;
        });


        saveMovies(updatedMovies);

        renderMovies();
    });


    /*
    |--------------------------------------------------------------------------
    | Initial Load
    |--------------------------------------------------------------------------
    */

    renderMovies();

</script>

</body>
</html>
